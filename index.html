<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ReByte | Soporte Técnico</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* CANVAS */
    #stars {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }

    .logo {
      height: 72px;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a, nav button {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    nav a:hover, nav button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 25px #38bdf8;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.3rem;
      max-width: 600px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- FONDO -->
  <canvas id="stars"></canvas>

  <!-- HEADER -->
  <header>
    <img src="assets/img/logo.png" class="logo" alt="ReByte logo">
    <nav>
      <a href="#">Inicio</a>
      <button>Servicios</button>
      <a href="#">Soporte urgente</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>ReByte</h1>
    <p>Cuidamos lo que te conecta. Soporte técnico premium para computadores y portátiles.</p>
  </section>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    const STAR_COUNT = 150;

    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.r = Math.random() * 1.5 + 0.5;
        this.dx = (Math.random() - 0.5) * 0.3;
        this.dy = (Math.random() - 0.5) * 0.3;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
      }

      update() {
        this.x += this.dx;
        this.y += this.dy;

        if (this.x < 0 || this.x > canvas.width) this.x = Math.random() * canvas.width;
        if (this.y < 0 || this.y > canvas.height) this.y = Math.random() * canvas.height;
      }
    }

    function init() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => { s.update(); s.draw(); });
      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>

</body>
</html>
